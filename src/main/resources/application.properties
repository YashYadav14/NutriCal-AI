spring.application.name=nutrition-backend

# Render dynamic port
server.port=${PORT:8080}

# The AI diet endpoints return Mono<...> and are handled as async requests.
# Spring Boot/Tomcat's default async timeout is only 30 seconds, which is
# shorter than the weekly plan's own internal timeout (55s) and can be shorter
# than daily/chat calls under slow AI response too — causing the container to
# abort the request and return an error before the AI call even finishes.
# Set generously above the largest possible internal wait (primary attempt +
# fallback model attempt + retry backoff for the weekly endpoint).
spring.mvc.async.request-timeout=150000

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/nutrition_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini AI
# NOTE: using the rolling "-latest" aliases instead of pinned snapshots (e.g. gemini-2.5-flash-lite)
# because Google has been retiring dated snapshots quickly in 2026. If these ever 404 again,
# run: curl "https://generativelanguage.googleapis.com/v1beta/models?key=YOUR_KEY"
# and swap in whatever model names come back with generateContent support.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
# If the primary model above fails after retries, one attempt is made against this lighter model.
gemini.api.fallback-url=${GEMINI_FALLBACK_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}
